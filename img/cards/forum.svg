<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">

  <defs>
    <linearGradient id="forum_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8ebe8"/>
      <stop offset="1" stop-color="#009DA0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#forum_bg)"/>
  <!-- Speech bubble 1 (large, back) -->
  <g transform="translate(180,80)">
    <path d="M0,0 h310 a18,18 0 0 1 18,18 v90 a18,18 0 0 1 -18,18 h-150 l-30,30 v-30 h-130 a18,18 0 0 1 -18,-18 v-90 a18,18 0 0 1 18,-18 z" fill="white" opacity="0.97"/>
    <g fill="#4a5558" opacity="0.7">
      <rect x="20" y="30" width="220" height="6" rx="2"/>
      <rect x="20" y="48" width="260" height="6" rx="2"/>
      <rect x="20" y="66" width="200" height="6" rx="2"/>
      <rect x="20" y="84" width="240" height="6" rx="2"/>
    </g>
  </g>
  <!-- Speech bubble 2 (medium, middle) -->
  <g transform="translate(80,200)">
    <path d="M0,0 h220 a16,16 0 0 1 16,16 v75 a16,16 0 0 1 -16,16 h-90 l-26,24 v-24 h-104 a16,16 0 0 1 -16,-16 v-75 a16,16 0 0 1 16,-16 z" fill="#1a2325"/>
    <g fill="white" opacity="0.85">
      <rect x="18" y="26" width="160" height="5" rx="2"/>
      <rect x="18" y="42" width="180" height="5" rx="2"/>
      <rect x="18" y="58" width="140" height="5" rx="2"/>
      <rect x="18" y="74" width="170" height="5" rx="2"/>
    </g>
  </g>
  <!-- Speech bubble 3 (small, foreground, with typing dots) -->
  <g transform="translate(490,240)">
    <path d="M0,0 h180 a16,16 0 0 1 16,16 v60 a16,16 0 0 1 -16,16 h-130 l-22,20 v-20 h-28 a16,16 0 0 1 -16,-16 v-60 a16,16 0 0 1 16,-16 z" fill="white"/>
    <g fill="#009DA0">
      <circle cx="50" cy="46" r="6"/>
      <circle cx="78" cy="46" r="6"/>
      <circle cx="106" cy="46" r="6"/>
    </g>
  </g>
  <!-- Avatar circles -->
  <g>
    <circle cx="140" cy="100" r="22" fill="#fa915c"/>
    <text x="140" y="106" fill="white" font-family="Arial Black, Arial, sans-serif" font-size="17" font-weight="900" text-anchor="middle">JG</text>
    <circle cx="60" cy="222" r="18" fill="#a8ebe8"/>
    <text x="60" y="227" fill="#1a2325" font-family="Arial Black, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle">DM</text>
    <circle cx="470" cy="262" r="18" fill="#5fc4d8"/>
    <text x="470" y="267" fill="white" font-family="Arial Black, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle">FK</text>
  </g>

</svg>