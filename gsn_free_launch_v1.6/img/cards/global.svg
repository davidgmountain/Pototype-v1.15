<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">

  <defs>
    <radialGradient id="space" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#0a3540"/>
      <stop offset="1" stop-color="#000a14"/>
    </radialGradient>
    <radialGradient id="earth" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#5fc4d8"/>
      <stop offset="0.6" stop-color="#0e7088"/>
      <stop offset="1" stop-color="#082c45"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#space)"/>
  <!-- Stars -->
  <g fill="white">
    <circle cx="80" cy="60" r="1.5" opacity="0.9"/>
    <circle cx="180" cy="40" r="1" opacity="0.7"/>
    <circle cx="300" cy="80" r="1.5" opacity="0.85"/>
    <circle cx="700" cy="50" r="1" opacity="0.7"/>
    <circle cx="640" cy="120" r="1.5" opacity="0.85"/>
    <circle cx="120" cy="320" r="1" opacity="0.7"/>
    <circle cx="80" cy="240" r="1.5" opacity="0.85"/>
    <circle cx="730" cy="280" r="1" opacity="0.85"/>
    <circle cx="680" cy="350" r="1.5" opacity="0.85"/>
    <circle cx="40" cy="160" r="1" opacity="0.6"/>
  </g>
  <!-- Earth -->
  <circle cx="400" cy="200" r="155" fill="url(#earth)"/>
  <!-- Atmosphere glow -->
  <circle cx="400" cy="200" r="172" fill="none" stroke="#a8ebe8" stroke-width="1.5" opacity="0.35"/>
  <!-- Continents (very stylised silhouettes) -->
  <g fill="#1a4d2e" opacity="0.85">
    <path d="M340,130 q-15,15 -10,40 q5,15 25,18 q15,-5 12,-25 q-5,-25 -27,-33 z"/>
    <path d="M390,180 q-20,20 -10,55 q15,30 35,28 q25,-5 28,-30 q-5,-30 -28,-50 q-12,-8 -25,-3 z"/>
    <path d="M460,140 q-15,15 -10,38 q15,18 35,8 q15,-12 5,-30 q-12,-15 -30,-16 z"/>
    <path d="M310,220 q-12,15 0,35 q15,15 30,5 q5,-15 -8,-28 q-12,-12 -22,-12 z"/>
    <path d="M455,255 q-5,18 8,28 q12,5 22,-5 q5,-15 -5,-25 q-15,-8 -25,2 z"/>
  </g>
  <!-- Connection arcs over the globe -->
  <g stroke="#a8ebe8" stroke-width="1.2" fill="none" opacity="0.7" stroke-dasharray="3 3">
    <path d="M300,180 Q400,80 500,160"/>
    <path d="M340,260 Q450,330 510,250"/>
    <path d="M280,200 Q380,260 490,230"/>
  </g>
  <!-- Location pins on globe -->
  <g fill="#a8ebe8">
    <circle cx="300" cy="180" r="4"/>
    <circle cx="500" cy="160" r="4"/>
    <circle cx="340" cy="260" r="4"/>
    <circle cx="510" cy="250" r="4"/>
    <circle cx="380" cy="200" r="3"/>
    <circle cx="455" cy="195" r="3"/>
  </g>
  <!-- "100+" caption -->
  <g opacity="0.75">
    <text x="700" y="200" fill="white" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900" text-anchor="middle">100+</text>
    <text x="700" y="225" fill="white" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" opacity="0.8">COUNTRIES</text>
  </g>

</svg>